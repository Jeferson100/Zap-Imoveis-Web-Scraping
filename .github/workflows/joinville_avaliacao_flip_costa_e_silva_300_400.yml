name: "Avaliacao Flip Joinville - Bairro Costa e Silva (Batches 300-400)"
on:
  workflow_run:
    workflows: ["Avaliacao Flip Joinville - Bairro Costa e Silva (Batches 200-300)"]
    types:
      - completed
  workflow_dispatch:
jobs:
  batch_300_310:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "300"
      limite_superior: "310"
      bairro: "costa e silva"
    secrets: inherit

  batch_310_320:
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "310"
      limite_superior: "320"
      bairro: "costa e silva"
    secrets: inherit

  batch_320_330:
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "320"
      limite_superior: "330"
      bairro: "costa e silva"
    secrets: inherit

  batch_330_340:
    needs: [batch_300_310]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "330"
      limite_superior: "340"
      bairro: "costa e silva"
    secrets: inherit

  batch_340_350:
    needs: [batch_310_320]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "340"
      limite_superior: "350"
      bairro: "costa e silva"
    secrets: inherit

  batch_350_360:
    needs: [batch_320_330]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "350"
      limite_superior: "360"
      bairro: "costa e silva"
    secrets: inherit

  batch_360_370:
    needs: [batch_330_340]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "360"
      limite_superior: "370"
      bairro: "costa e silva"
    secrets: inherit

  batch_370_380:
    needs: [batch_340_350]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "370"
      limite_superior: "380"
      bairro: "costa e silva"
    secrets: inherit

  batch_380_390:
    needs: [batch_350_360]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "380"
      limite_superior: "390"
      bairro: "costa e silva"
    secrets: inherit

  batch_390_400:
    needs: [batch_360_370]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "390"
      limite_superior: "400"
      bairro: "costa e silva"
    secrets: inherit

  merge:
    needs: [batch_300_310, batch_310_320, batch_320_330, batch_330_340, batch_340_350, batch_350_360, batch_360_370, batch_370_380, batch_380_390, batch_390_400]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'refs/heads/main'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar uv
        run: pip install uv
      - name: Instalar dependencias
        run: |
          uv venv
          uv pip install -e .
      - name: Juntar batches
        run: uv run codigos_rodando/joinville/merge_batches.py
        env:
          BAIRRO_SELECAO: "costa e silva"
      - name: Commit merge
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A dados/joinville/
          FEITO=false
          git commit -m "Avaliacao Flip Joinville [0-400]: merge batches costa e silva" && FEITO=true || echo "Nada para commitar"
          if [ "$FEITO" = true ]; then
            # Merge toca o consolidado + deleta batches: retry com union-resolve
            # (concat + dedupe por url) em vez de rebase -X ours, que descarta linhas.
            ARQ="dados/joinville/*avaliacao_flip*.parquet dados/joinville/avaliacao_flip_*.parquet"
            # Delta deste merge: reaplicamos so o que ESTE job mudou, para nao
            # reverter arquivos que outros jobs publicaram enquanto rodavamos.
            DELTA=$(git diff --name-only HEAD~1 HEAD || true)

            OK=false
            for tentativa in 1 2 3; do
              git fetch origin main || { sleep 20; continue; }
              # shellcheck disable=SC2086
              uv run codigos_rodando/joinville/union_flip_parquet.py $ARQ

              # --mixed: indice = main atual; worktree (merge + union) preservado.
              # Com --soft, o indice velho ia no commit e revertia/deletava
              # arquivos que outros jobs acabaram de publicar no main.
              git reset origin/main
              if [ -n "$DELTA" ]; then echo "$DELTA" | xargs -r git add -A --; fi
              if git diff --cached --quiet; then
                echo "merge ja integrado ao main, nada a commitar"
                OK=true
                break
              fi
              git commit -m "Avaliacao Flip Joinville [0-400]: merge batches costa e silva"
              if git push origin main; then OK=true; break; fi
              echo "push rejeitado (tentativa $tentativa)"
              sleep 20
            done
            if [ "$OK" != true ]; then echo "push falhou 3x"; exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
