name: Atualizar Site Estatico
on:
  push:
    branches: [main]
    paths:
      - 'dados/**'
  workflow_dispatch:

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar arquivos do repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install uv
          uv venv
          source .venv/bin/activate
          make uv_install

      - name: Exportar dados do site
        run: |
          source .venv/bin/activate
          python scripts/exportar_dados.py
        env:
          CIDADE_EXPORTAR: todas

      - name: Exportar modelos JS
        run: |
          source .venv/bin/activate
          python scripts/exportar_modelo_js.py

  sincronizar:
    needs: exportar
    uses: ./.github/workflows/sync_site.yml
    secrets: inherit
