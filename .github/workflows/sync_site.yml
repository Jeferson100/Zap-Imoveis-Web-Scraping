name: Sincronizar Site Analise-imoveis
on:
  workflow_call:
  workflow_run:
    workflows: ["Rodando Exportacao Site Joinville"]
    types:
      - completed
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_call'
      }}
    steps:
      - name: Copiar arquivos do repo
        uses: actions/checkout@v4

      - name: Sincronizar site_estatico para Analise-imoveis
        run: |
          set -e
          echo "=== Sincronizando site_estatico/ para Analise-imoveis ==="

          # Limpar clone anterior
          rm -rf /tmp/site

          # Clonar o repo do site
          if ! git clone https://${{ secrets.SITE_SYNC_TOKEN }}@github.com/Jeferson100/Analise-imoveis.git /tmp/site; then
            echo "ERRO: Falha ao clonar repo Analise-imoveis"
            exit 1
          fi

          # Verificar se clone e valido
          if [ ! -d "/tmp/site/.git" ]; then
            echo "ERRO: Clone nao criou diretorio valido"
            exit 1
          fi

          # Limpar conteudo antigo (manter .git)
          cd /tmp/site
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

          # Copiar tudo de site_estatico
          cp -r "$GITHUB_WORKSPACE/site_estatico/index.html" .
          cp -r "$GITHUB_WORKSPACE/site_estatico/css" .
          cp -r "$GITHUB_WORKSPACE/site_estatico/js" .
          cp -r "$GITHUB_WORKSPACE/site_estatico/data" .

          # Configurar git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Verificar se ha mudancas
          if git diff --quiet && git diff --staged --quiet; then
            echo "Nenhuma mudanca detectada."
          else
            git add -A
            git commit -m "Atualizacao: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
            echo "Push realizado com sucesso!"
          fi
