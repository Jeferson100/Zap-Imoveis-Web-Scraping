name: "Avaliacao Flip Joinville - Bairro Gloria (Batches 200-300)"
on:
  workflow_run:
    workflows: ["Avaliacao Flip Joinville - Bairro Gloria (Batches 100-200)"]
    types:
      - completed
  workflow_dispatch:
jobs:
  batch_200_210:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "200"
      limite_superior: "210"
      bairro: "gloria"
    secrets: inherit

  batch_210_220:
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "210"
      limite_superior: "220"
      bairro: "gloria"
    secrets: inherit

  batch_220_230:
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "220"
      limite_superior: "230"
      bairro: "gloria"
    secrets: inherit

  batch_230_240:
    needs: [batch_200_210]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "230"
      limite_superior: "240"
      bairro: "gloria"
    secrets: inherit

  batch_240_250:
    needs: [batch_210_220]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "240"
      limite_superior: "250"
      bairro: "gloria"
    secrets: inherit

  batch_250_260:
    needs: [batch_220_230]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "250"
      limite_superior: "260"
      bairro: "gloria"
    secrets: inherit

  batch_260_270:
    needs: [batch_230_240]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "260"
      limite_superior: "270"
      bairro: "gloria"
    secrets: inherit

  batch_270_280:
    needs: [batch_240_250]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "270"
      limite_superior: "280"
      bairro: "gloria"
    secrets: inherit

  batch_280_290:
    needs: [batch_250_260]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "280"
      limite_superior: "290"
      bairro: "gloria"
    secrets: inherit

  batch_290_300:
    needs: [batch_260_270]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "290"
      limite_superior: "300"
      bairro: "gloria"
    secrets: inherit
