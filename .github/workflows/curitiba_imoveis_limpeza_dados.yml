name: Rodando Limpeza Imoveis Curitiba
on: 

  workflow_run:
    workflows: ["Rodando Juncao Dados Curitiba"]
    types:
      - completed
  workflow_dispatch:

jobs:
  coleta_limpando_dados_curitiba_chave_mao:
    uses: ./.github/workflows/pipeline_cidade_rodando.yml
    with:
      cidade_pasta: curitiba
      arquivo_rodando_imovel: curitiba_limpando_dados_chave_mao.py
      cidade_limpeza: curitiba
      cidade_localizacao: Curitiba
      estado_limpeza: pr
      estado_localizacao: PR

  coleta_limpando_dados_curitiba_zap:
    uses: ./.github/workflows/pipeline_cidade_rodando.yml
    with:
      cidade_pasta: curitiba
      arquivo_rodando_imovel: curitiba_limpando_dados_zap.py
      cidade_limpeza: curitiba
      cidade_localizacao: Curitiba
      estado_limpeza: pr
      estado_localizacao: PR

  coleta_limpando_dados_curitiba_viva_real:
    uses: ./.github/workflows/pipeline_cidade_rodando.yml
    with:
      cidade_pasta: curitiba
      arquivo_rodando_imovel: curitiba_limpando_dados_viva_real.py
      cidade_limpeza: curitiba
      cidade_localizacao: Curitiba
      estado_limpeza: pr
      estado_localizacao: PR