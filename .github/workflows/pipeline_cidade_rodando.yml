name: Pipeline Cidade

on:
  workflow_call:
    inputs:
      cidade_pasta:
        required: true
        type: string
      arquivo_rodando_imovel:
        required: true
        type: string
      headless:
        required: false
        type: boolean
        default: true
      max_concurrency_chave:
        required: false
        type: number
        default: 5
      max_concurrency_olx:
        required: false
        type: number
        default: 5
      max_concurrency_zap:
        required: false
        type: number
        default: 3
      cidade_limpeza:
        required: false 
        type: string
      cidade_localizacao:
        required: false
        type: string
      estado_limpeza:
        required: false
        type: string
      estado_localizacao:
        required: false
        type: string
      max_concurrency_localizacao:
        required: false
        type: number
        default: 20
      batch_limpeza:
        required: false
        type: number
        default: 20
      tipo_async:
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copia os arquivos do repo
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar o uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Criar ambiente virtual
        run: |
          uv venv

      - name: Instalar as bibliotecas
        run: |
          source .venv/bin/activate
          make uv_install

      - name: Instalar o Playwright
        run: |
          uv pip install -e .
          uv pip install playwright
          uv run playwright install

      - name: Rodar o código do imóvel
        if: ${{ inputs.arquivo_rodando_imovel != '' }}
        run: uv run codigos_rodando/${{ inputs.cidade_pasta }}/${{ inputs.arquivo_rodando_imovel }}
        env:
          CIDADE_PASTA: ${{ inputs.cidade_pasta }}
          HEADLESS: ${{ inputs.headless }}
          MAX_CONCURRENCY_CHAVE: ${{ inputs.max_concurrency_chave }}
          MAX_CONCURRENCY_OLX: ${{ inputs.max_concurrency_olx }}
          MAX_CONCURRENCY: ${{ inputs.max_concurrency_zap }}
          CIDADE_LIMPEZA: ${{ inputs.cidade_limpeza }}
          MAX_CONCURRENCY_LOCALIZACAO: ${{ inputs.max_concurrency_localizacao }}
          BATCH_LIMPEZA: ${{ inputs.batch_limpeza }}
          TIPO_ASYNC: ${{ inputs.tipo_async }}
          CIDADE_LOCALIZACAO: ${{ inputs.cidade_localizacao }}
          ESTADO_LIMPEZA: ${{ inputs.estado_limpeza }}
          ESTADO_LOCALIZACAO: ${{ inputs.estado_localizacao }}

      - name: Commit e Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dados/
          git commit -m "Pipeline ${{ inputs.cidade_pasta}}: $(date +'%Y-%m-%d')" || echo "Nada para commitar"
          git pull --no-rebase -X ours origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}