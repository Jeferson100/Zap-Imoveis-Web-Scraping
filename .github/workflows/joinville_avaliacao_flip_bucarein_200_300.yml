name: "Avaliacao Flip Joinville - Bairro Bucarein (Batches 200-300)"
on:
  workflow_run:
    workflows: ["Avaliacao Flip Joinville - Bairro Bucarein (Batches 100-200)"]
    types:
      - completed
  workflow_dispatch:
jobs:
  batch_200_210:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "200"
      limite_superior: "210"
      bairro: "bucarein"
    secrets: inherit

  batch_210_220:
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "210"
      limite_superior: "220"
      bairro: "bucarein"
    secrets: inherit

  batch_220_230:
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "220"
      limite_superior: "230"
      bairro: "bucarein"
    secrets: inherit

  batch_230_240:
    needs: [batch_200_210]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "230"
      limite_superior: "240"
      bairro: "bucarein"
    secrets: inherit

  batch_240_250:
    needs: [batch_210_220]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "240"
      limite_superior: "250"
      bairro: "bucarein"
    secrets: inherit

  batch_250_260:
    needs: [batch_220_230]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "250"
      limite_superior: "260"
      bairro: "bucarein"
    secrets: inherit

  batch_260_270:
    needs: [batch_230_240]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "260"
      limite_superior: "270"
      bairro: "bucarein"
    secrets: inherit

  batch_270_280:
    needs: [batch_240_250]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "270"
      limite_superior: "280"
      bairro: "bucarein"
    secrets: inherit

  batch_280_290:
    needs: [batch_250_260]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "280"
      limite_superior: "290"
      bairro: "bucarein"
    secrets: inherit

  batch_290_300:
    needs: [batch_260_270]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "290"
      limite_superior: "300"
      bairro: "bucarein"
    secrets: inherit

  merge:
    needs: [batch_200_210, batch_210_220, batch_220_230, batch_230_240, batch_240_250, batch_250_260, batch_260_270, batch_270_280, batch_280_290, batch_290_300]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'refs/heads/main'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar uv
        run: pip install uv
      - name: Instalar dependencias
        run: |
          uv venv
          uv pip install -e .
      - name: Juntar batches
        run: uv run codigos_rodando/joinville/merge_batches.py
        env:
          BAIRRO_SELECAO: "bucarein"
      - name: Commit merge
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A dados/joinville/
          FEITO=false
          git commit -m "Avaliacao Flip Joinville [0-300]: merge batches bucarein" && FEITO=true || echo "Nada para commitar"
          if [ "$FEITO" = true ]; then
            # Merge toca o consolidado + deleta batches: retry com union-resolve
            # (concat + dedupe por url) em vez de rebase -X ours, que descarta linhas.
            ARQ="dados/joinville/*avaliacao_flip*.parquet dados/joinville/avaliacao_flip_*.parquet"
            # Delta deste merge: reaplicamos so o que ESTE job mudou, para nao
            # reverter arquivos que outros jobs publicaram enquanto rodavamos.
            DELTA=$(git diff --name-only HEAD~1 HEAD || true)

            OK=false
            for tentativa in 1 2 3; do
              git fetch origin main || { sleep 20; continue; }
              # shellcheck disable=SC2086
              uv run codigos_rodando/joinville/union_flip_parquet.py $ARQ

              # --mixed: indice = main atual; worktree (merge + union) preservado.
              # Com --soft, o indice velho ia no commit e revertia/deletava
              # arquivos que outros jobs acabaram de publicar no main.
              git reset origin/main
              if [ -n "$DELTA" ]; then echo "$DELTA" | xargs -r git add -A --; fi
              if git diff --cached --quiet; then
                echo "merge ja integrado ao main, nada a commitar"
                OK=true
                break
              fi
              git commit -m "Avaliacao Flip Joinville [0-300]: merge batches bucarein"
              if git push origin main; then OK=true; break; fi
              echo "push rejeitado (tentativa $tentativa)"
              sleep 20
            done
            if [ "$OK" != true ]; then echo "push falhou 3x"; exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}