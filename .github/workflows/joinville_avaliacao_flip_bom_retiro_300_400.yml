name: "Avaliacao Flip Joinville - Bairro Bom Retiro (Batches 300-400)"
on:
  workflow_run:
    workflows: ["Avaliacao Flip Joinville - Bairro Bom Retiro (Batches 200-300)"]
    types:
      - completed
  workflow_dispatch:
jobs:
  batch_300_310:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "300"
      limite_superior: "310"
      bairro: "bom retiro"
    secrets: inherit

  batch_310_320:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "310"
      limite_superior: "320"
      bairro: "bom retiro"
    secrets: inherit

  batch_320_330:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "320"
      limite_superior: "330"
      bairro: "bom retiro"
    secrets: inherit

  batch_330_340:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "330"
      limite_superior: "340"
      bairro: "bom retiro"
    secrets: inherit

  batch_340_350:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "340"
      limite_superior: "350"
      bairro: "bom retiro"
    secrets: inherit

  batch_350_360:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "350"
      limite_superior: "360"
      bairro: "bom retiro"
    secrets: inherit

  batch_360_370:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "360"
      limite_superior: "370"
      bairro: "bom retiro"
    secrets: inherit

  batch_370_380:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "370"
      limite_superior: "380"
      bairro: "bom retiro"
    secrets: inherit

  batch_380_390:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "380"
      limite_superior: "390"
      bairro: "bom retiro"
    secrets: inherit

  batch_390_400:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "390"
      limite_superior: "400"
      bairro: "bom retiro"
    secrets: inherit

  merge:
    needs: [batch_300_310, batch_310_320, batch_320_330, batch_330_340, batch_340_350, batch_350_360, batch_360_370, batch_370_380, batch_380_390, batch_390_400]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'refs/heads/main'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar uv
        run: pip install uv
      - name: Instalar dependencias
        run: |
          uv venv
          uv pip install -e .
      - name: Juntar batches
        run: uv run codigos_rodando/joinville/merge_batches.py
        env:
          BAIRRO_SELECAO: "bom retiro"
      - name: Commit merge
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A dados/joinville/
          git commit -m "Avaliacao Flip Joinville [0-400]: merge batches bom retiro" || echo "Nada para commitar"
          git pull --rebase --autostash -X ours origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}