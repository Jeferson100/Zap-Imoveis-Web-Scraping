name: Rodando Avaliacao Flip Joinville

on:
  workflow_dispatch:
    inputs:
      limite_imoveis:
        description: "Maximo de imoveis para avaliar"
        required: false
        default: "10"
      max_concorrencia:
        description: "Paralelismo (MAX_CONCORRENCIA_FLIP)"
        required: false
        default: "1"
      bairro_selecao:
        description: "Bairro para avaliacao"
        required: false
        default: "atiradores"

jobs:
  avaliacao_flip:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        run: pip install uv

      - name: Instalar dependencias
        run: |
          uv venv
          uv pip install -e .
          uv pip install huggingface_hub

      - name: Rodar avaliacao flip
        run: uv run codigos_rodando/joinville/joinville_avaliacao_flip.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
          PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYDANTIC_API_KEY: ${{ secrets.PYDANTIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_CONCORRENCIA_FLIP: ${{ github.event.inputs.max_concorrencia || '1' }}
          LIMITE_FLIP: ${{ github.event.inputs.limite_imoveis || '10' }}
          BAIRRO_SELECAO: ${{ github.event.inputs.bairro_selecao || 'atiradores' }}

      - name: Commit resultados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dados/joinville/*avaliacao_flip*.parquet
          git commit -m "Avaliacao Flip Joinville: $(date +'%Y-%m-%d')" || echo "Nada para commitar"
          git pull --rebase --autostash -X ours origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
