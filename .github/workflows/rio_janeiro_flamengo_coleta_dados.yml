      cidade_pasta: rio_janeiro
      arquivo_rodando_imovel: rio_janeiro_flamengo_coleta_dados_zap_imoveis.py
      URL_TEMPLATE_ZAP : "https://www.zapimoveis.com.br/venda/imoveis/rj+rio-de-janeiro+zona-sul+flamengo/?onde=%2CRio+de+Janeiro%2CRio+de+Janeiro%2CZona+Sul%2CFlamengo%2C%2C%2Cneighborhood%2CBR%3ERio+de+Janeiro%3ENULL%3ERio+de+Janeiro%3EZona+Sul%3EFlamengo%2C-22.933236%2C-43.174695%2C&pagina={pagina}"
