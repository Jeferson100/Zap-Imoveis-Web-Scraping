name: Rodando Limpeza Imoveis Rio Janeiro Leblon
on: 
  workflow_run:
        workflows: ["Rodando Coleta Rio Janeiro Leblon"]
        types:
            - completed
  workflow_dispatch:  

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline_cidade_rodando.yml
    with:
      cidade_pasta: rio_janeiro
      arquivo_rodando_imovel: rio_janeiro_leblon_limpando_dados.py
      cidade_limpeza: Rio de Janeiro
      cidade_localizacao: Rio de Janeiro
      estado_limpeza: rj
      estado_localizacao: RJ
      BAIRRO : leblon
      FILTRO_BAIRRO : "leblon"