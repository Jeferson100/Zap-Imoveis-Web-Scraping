name: "Avaliacao Flip Joinville -Bairro America (Batches 100-200)"
on:
  workflow_run:
    workflows: ["Avaliacao Flip Joinville -Bairro America (Batches 0-100)"]
    types:
      - completed
  workflow_dispatch:
jobs:
  batch_100_110:
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
    with:
      limite_inferior: "100"
      limite_superior: "110"
      bairro: "america"
    secrets: inherit

  batch_110_120:
    needs: [batch_100_110]
    if: always()
    uses: ./.github/workflows/joinville_avaliacao_flip_base.yml
