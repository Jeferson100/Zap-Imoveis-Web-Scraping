name: "Avaliacao Flip Joinville (Base)"

on:
  workflow_call:
    inputs:
      limite_inferior:
        required: true
        type: string
      limite_superior:
        required: true
        type: string
      bairro:
        required: false
        type: string
        default: "atiradores"
      max_concorrencia:
        required: false
        type: string
        default: "1"
      mes_ref:
        required: false
        type: string
        default: ""

jobs:
  avaliacao_flip:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        run: pip install uv

      - name: Instalar dependencias
        run: |
          uv venv
          uv pip install -e .
          uv pip install huggingface_hub

      - name: Rodar avaliacao flip
        run: uv run codigos_rodando/joinville/joinville_avaliacao_flip.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PHOENIX_ENABLED: "false"
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYDANTIC_API_KEY: ${{ secrets.PYDANTIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MAX_CONCORRENCIA_FLIP: ${{ inputs.max_concorrencia }}
          LIMITE_FLIP: ${{ inputs.limite_superior }}
          LIMITE_INFERIOR_FLIP: ${{ inputs.limite_inferior }}
          LIMITE_SUPERIOR_FLIP: ${{ inputs.limite_superior }}
          MES_REF: ${{ inputs.mes_ref }}
          SNAPSHOT_DATA: "true"
          BAIRRO_SELECAO: ${{ inputs.bairro }}

      - name: Commit parcial do flip
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Só o arquivo DESTE batch (glob exato por range): batches diferentes
          # nunca tocam o mesmo arquivo — sem isso, pushes paralelos conflitam.
          ARQ="dados/joinville/*avaliacao_flip_*_${{ inputs.limite_inferior }}_${{ inputs.limite_superior }}*.parquet"
          git add $ARQ 2>/dev/null || echo "nada para adicionar"
          FEITO=false
          git commit -m "flip parcial ${{ inputs.bairro }} ${{ inputs.limite_inferior }}-${{ inputs.limite_superior }}" && FEITO=true || echo "nada para commitar"
          if [ "$FEITO" = true ]; then
            OK=false
            for tentativa in 1 2 3; do
              git fetch origin main || { sleep 20; continue; }
              # union-resolve: incorpora linhas já commitadas no main (reruns
              # paralelos do mesmo batch) sem perder nada de nenhum lado
              # shellcheck disable=SC2086
              uv run codigos_rodando/joinville/union_flip_parquet.py $ARQ
              # --mixed: índice = árvore de origin/main, working tree preservado.
              # Com --soft o índice velho ia junto no commit e revertia/deletava
              # arquivos que outros batches acabaram de publicar no main.
              git reset origin/main
              git add $ARQ 2>/dev/null || true
              # Nada novo após o union (batch já integrado): não cria commit vazio
              if git diff --cached --quiet; then
                echo "batch já integrado ao main, nada a commitar"
                OK=true
                break
              fi
              git commit -m "flip parcial ${{ inputs.bairro }} ${{ inputs.limite_inferior }}-${{ inputs.limite_superior }}"
              if git push origin main; then OK=true; break; fi
              echo "push rejeitado (tentativa $tentativa)"
              sleep 20
            done
            if [ "$OK" != true ]; then echo "push falhou 3x"; exit 1; fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar resultado parcial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flip-${{ inputs.bairro }}-${{ inputs.limite_inferior }}-${{ inputs.limite_superior }}
          path: dados/joinville/*avaliacao_flip*.parquet
          if-no-files-found: warn
          retention-days: 7
