name: Predicao Sao Paulo Pinheiros - Melhor Modelo Geral

on:
  workflow_run:
    workflows: ["Predicao Sao Paulo Pinheiros - Otimizando Melhores Modelos"]
    types:
      - completed
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline_predicao_rodando.yml
    with:
      cidade_pasta: sao_paulo
      arquivo_rodando_imovel: sao_paulo_melhor_modelo_geral.py
      bairro: pinheiros
    secrets: inherit
