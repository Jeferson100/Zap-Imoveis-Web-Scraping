name: Rodando Treinamento de Imoveis de Balneario Picaras
on: 
    workflow_run:
        workflows: ["Rodando Limpeza Imoveis Balneario Picaras"]
        types:
            - completed
    workflow_dispatch:

jobs:
    treinamento_modelos_predicoes:
        uses: ./.github/workflows/pipeline_cidade_rodando.yml
        with:
            cidade_pasta: balneario_picaras
            arquivo_rodando_imovel: balneario_picaras_melhores_configuraoes_modelo.py
            DATABRICKS_HOST: "https://dbc-ed602b14-1f14.cloud.databricks.com"
            LOCALIZAZAO_COMPLETA : "Balneario Picarras, Santa Catarina, Brasil"
        secrets: inherit
