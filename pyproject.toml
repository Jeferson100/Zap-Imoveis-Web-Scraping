[project]
name = "preco-imoveis"
version = "0.1.0"
description = "Web scraping of data price of houses in Joinville-SC, Brazil"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "pandas==2.3.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.67.3",
    "unidecode>=1.4.0",
]

[project.optional-dependencies]
scraping = [
    "aiohttp>=3.13.3",
    "apify-fingerprint-datapoints>=0.10.0",
    "browserforge>=1.2.4",
    "bs4>=0.0.2",
    "curl-cffi>=0.7.0",
    "lxml>=6.0.2",
    "nest-asyncio>=1.6.0",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.1",
]
geo = [
    "geopy>=2.4.1",
    "osmnx>=2.1.0",
]
ml = [
    "catboost>=1.2.10",
    "databricks-sdk>=0.110.0",
    "lightgbm>=4.6.0",
    "llvmlite>=0.36.0",
    "mapie>=1.4.1",
    "matplotlib>=3.10.8",
    "mlflow>=3.12.0",
    "nltk>=3.9.4",
    "numba>=0.60.0",
    "optuna>=4.8.0",
    "scikit-learn==1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "spacy>=3.8.14",
    "statsmodels>=0.14.6",
    "xgboost>=3.2.0",
]
ml-dl = [
    "keras-tuner>=1.4.8",
    "tensorflow>=2.21.0",
]
vision = [
    "huggingface-hub>=0.25.0",
    "laya>=0.4.1",
    "pillow>=10.0.0",
    "scikit-learn==1.9.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]
agents = [
    "arize-phoenix>=17.28.0",
    "arize-phoenix-otel>=0.16.1",
    "cerebras-cloud-sdk>=1.67.0",
    "deepagents>=0.7.3",
    "groq>=1.5.0",
    "json-repair>=0.61.4",
    "langchain>=1.3.14",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.3.5",
    "langchain-openrouter>=0.2.7",
    "langgraph>=1.2.8",
    "nest-asyncio>=1.6.0",
    "pydantic-ai>=2.8.0",
]
app = [
    "databricks-sdk>=0.110.0",
    "matplotlib>=3.10.8",
    "mlflow>=3.12.0",
    "plotly>=6.5.2",
    "scikit-learn==1.9.1",
    "seaborn>=0.13.2",
    "streamlit==1.54.0",
]
notebooks = [
    "ipykernel>=7.1.0",
    "langchain-ollama>=1.1.0",
    "nbformat>=4.2.0",
    "ollama>=0.6.2",
]
all = [
    "preco-imoveis[scraping,geo,ml,ml-dl,vision,agents,app]",
]

[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "scraping_zap_imoveis*",
    "agente_avaliacao_imagens*",
    "agente_validacao*",
    "agente_potencial_flip*",
    "roteador_llms*",
    "shared*",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "nbformat>=4.2.0",
    "opencode-ai==0.1.0a36",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
