[project]
name = "preco-imoveis"
version = "0.1.0"
description = "Web scraping of data price of houses in Joinville-SC, Brazil"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "apify-fingerprint-datapoints>=0.10.0",
    "balltree>=1.1.1",
    "boruta>=0.4.3",
    "browserforge>=1.2.4",
    "bs4>=0.0.2",
    "catboost>=1.2.10",
    "crawlee>=1.3.1",
    "databricks-sdk>=0.110.0",
    "distutils-pytest>=0.2.1",
    "geopy>=2.4.1",
    "googlemaps>=4.10.0",
    "groq>=1.5.0",
    "httpx>=0.28.1",
    "ipykernel>=7.1.0",
    "joblib>=1.5.3",
    "keras-tuner>=1.4.8",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langgraph>=1.2.8",
    "lightgbm>=4.6.0",
    "lxml>=6.0.2",
    "mapie>=1.4.1",
    "matplotlib>=3.10.8",
    "mlflow>=3.12.0",
    "nbformat>=4.2.0",
    "nest-asyncio>=1.6.0",
    "nltk>=3.9.4",
    "nodriver>=0.48.1",
    "optuna>=4.8.0",
    "osmnx>=2.1.0",
    "pandas==2.3.3",
    "pgeocode>=0.5.0",
    "pingouin>=0.5.5",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.1",
    "plotly>=6.5.2",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "selenium>=4.40.0",
    "setuptools>=80.10.2",
    "shap>=0.51.0",
    "spacy>=3.8.14",
    "statsmodels>=0.14.6",
    "streamlit==1.54.0",
    "tensorboard>=2.20.0",
    "tensorflow>=2.21.0",
    "tqdm>=4.67.3",
    "undetected-chromedriver>=3.5.5",
    "unicode>=2.9",
    "unidecode>=1.4.0",
    "webdriver-manager>=4.0.2",
    "xgboost>=3.2.0",
    "zapimoveis-scraper>=0.4.0",
]

[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["scraping_zap_imoveis"]
